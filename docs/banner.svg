    <rect x="134" y="18" width="46" height="40" fill="#111111"/>
    <text x="120" y="82" fill="#111111" font-family="ui-monospace, monospace" font-size="10" font-weight="600">02 / TRABAJO</text>

    <rect x="220" y="0" width="94" height="94" fill="#111111" stroke="#111111" stroke-width="1.5"/>
    <polygon points="267,18 292,33 292,55 267,68 242,55 242,33" fill="#F7F7F5"/>
    <text x="230" y="82" fill="#F7F7F5" font-family="ui-monospace, monospace" font-size="10" font-weight="600">03 / OVERRIDE</text>
