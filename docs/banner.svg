  <text x="56" y="356" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.5">ASTRO 7  ·  GSAP  ·  PAPER SHADERS  ·  CLOUDFLARE WORKERS  ·  R2</text>
