  <text x="56" y="168" fill="#111111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-3">IDEAS QUE SE VUELVEN</text>
  <rect x="56" y="186" width="492" height="78" fill="#111111"/>
  <text x="74" y="246" fill="#F7F7F5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-3">PRODUCTOS.</text>

  <!-- Halftone specimen blocks on the right -->
  <g transform="translate(860, 126)">
    <rect x="0" y="0" width="94" height="94" fill="#F7F7F5" stroke="#111111" stroke-width="1.5"/>
    <circle cx="47" cy="40" r="22" fill="#111111" fill-opacity="0.88"/>
    <text x="10" y="82" fill="#111111" font-family="ui-monospace, monospace" font-size="10" font-weight="600">01 / INICIO</text>

