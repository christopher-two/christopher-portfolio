  <text x="78" y="63" fill="#5C5C58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">CHRISTOPHER TWO · PROOF SHEET PORTFOLIO</text>
