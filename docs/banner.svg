    </pattern>
    <pattern id="ruler" width="24" height="10" patternUnits="userSpaceOnUse">
      <line x1="8" y1="5" x2="24" y2="5" stroke="#111111" stroke-opacity="0.32" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="#F7F7F5"/>
  <rect width="1280" height="420" fill="url(#dots)"/>
  <rect x="24" y="24" width="1232" height="372" stroke="#111111" stroke-width="2" fill="none"/>

  <!-- Right-edge scroll ruler motif -->
  <rect x="1220" y="36" width="24" height="348" fill="url(#ruler)"/>
  <line x1="1206" y1="210" x2="1244" y2="210" stroke="#111111" stroke-width="2"/>
  <line x1="1212" y1="200" x2="1244" y2="200" stroke="#111111" stroke-width="1.4"/>
  <line x1="1212" y1="220" x2="1244" y2="220" stroke="#111111" stroke-width="1.4"/>

